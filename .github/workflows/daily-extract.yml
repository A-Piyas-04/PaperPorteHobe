name: Daily extraction (free quota)

# Continues full text + LLM extraction where yesterday's free quota stopped, then rebuilds and
# publishes. Runs just after Gemini's daily reset (midnight Pacific) on every day except the
# weekly-refresh day. Previous days' work is cached, so nothing is requested twice.
on:
  schedule:
    - cron: "45 8 * * 2-6,0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  continue:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SCHOLARGRID_CONFIG: configs/refresh.yaml
      SCHOLARGRID_ENV: production
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
      S2_API_KEY: ${{ secrets.S2_API_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt sentry-sdk
      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/stages
            data/releases
            data/fulltext
            data/extract
            data/llm_cache
            data/llm_usage
          key: scholargrid-data-${{ github.run_id }}
          restore-keys: scholargrid-data-
      - run: python pipeline/run_pipeline.py --from-stage fulltext
      - if: always()
        run: python -m scholargrid.extract stats && python -m scholargrid.llm quota || true
      - name: Publish release to the Hugging Face Space
        if: success() && env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          pip install -U huggingface_hub
          rel="$(cat data/releases/CURRENT)"
          mkdir -p _space_releases
          cp -r "data/releases/$rel" _space_releases/
          cp data/releases/CURRENT _space_releases/
          hf upload "$HF_SPACE" _space_releases data/releases --repo-type=space \
            --delete "*" --commit-message "release $rel"
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily extraction failed (${new Date().toISOString().slice(0, 10)})`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe previous release is still live. See Docs/runbook.md.`,
              labels: ["refresh-failure"],
            });
