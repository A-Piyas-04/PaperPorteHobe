name: Weekly data refresh

on:
  schedule:
    - cron: "30 8 * * 1"   # Mondays 08:30 UTC, just after Gemini's daily reset (midnight Pacific)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SCHOLARGRID_CONFIG: configs/refresh.yaml
      SCHOLARGRID_ENV: production
      OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      S2_API_KEY: ${{ secrets.S2_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SCHOLARGRID_DB_URL: ${{ secrets.SCHOLARGRID_DB_URL }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}              # repository variable, e.g. "<hf-user>/scholargrid"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt sentry-sdk
      - name: Restore data store and caches
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/stages
            data/releases
            data/fulltext
            data/extract
            data/llm_cache
            data/llm_usage
          key: scholargrid-data-${{ github.run_id }}
          restore-keys: scholargrid-data-
      - name: Harvest new papers (OAI-PMH), enrich, full text, extract, rebuild, gaps, validate, publish
        run: python pipeline/run_pipeline.py
      - name: Extraction progress and free quota
        if: always()
        run: python -m scholargrid.extract stats && python -m scholargrid.llm quota || true
      - name: Purge old telemetry and anonymous projects
        if: success() && env.SCHOLARGRID_DB_URL != ''
        run: |
          python -m scholargrid.persistence purge-events
          python -m scholargrid.persistence purge
      - name: Publish release to the Hugging Face Space
        if: success() && env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          pip install -U huggingface_hub
          rel="$(cat data/releases/CURRENT)"
          mkdir -p _space_releases
          cp -r "data/releases/$rel" _space_releases/
          cp data/releases/CURRENT _space_releases/
          hf upload "$HF_SPACE" _space_releases data/releases --repo-type=space \
            --delete "*" --commit-message "release $rel"
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-report-${{ github.run_id }}
          path: reports/
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly refresh failed (${new Date().toISOString().slice(0, 10)})`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe previous release is still live. See Docs/runbook.md.`,
              labels: ["refresh-failure"],
            });

  db-backup:
    # Weekly pg_dump of the projects database (Neon free tier) kept as a 30-day artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCHOLARGRID_DB_URL: ${{ secrets.SCHOLARGRID_DB_URL }}
    steps:
      - name: Dump the database
        if: env.SCHOLARGRID_DB_URL != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          url="${SCHOLARGRID_DB_URL/postgresql+psycopg:/postgresql:}"
          pg_dump --no-owner --format=custom "$url" > scholargrid-db.dump
      - uses: actions/upload-artifact@v4
        if: env.SCHOLARGRID_DB_URL != ''
        with:
          name: db-backup-${{ github.run_id }}
          path: scholargrid-db.dump
          retention-days: 30
