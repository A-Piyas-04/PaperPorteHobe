name: Weekly data refresh

on:
  schedule:
    - cron: "0 4 * * 1"   # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SCHOLARGRID_CONFIG: configs/refresh.yaml
      SCHOLARGRID_ENV: production
      OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      S2_API_KEY: ${{ secrets.S2_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt sentry-sdk
      - name: Restore data store and caches
        uses: actions/cache@v6
        with:
          path: |
            data/raw
            data/stages
            data/releases
          key: scholargrid-data-${{ github.run_id }}
          restore-keys: scholargrid-data-
      - name: Harvest new papers (OAI-PMH), enrich, rebuild, validate, publish
        run: python pipeline/run_pipeline.py
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-report-${{ github.run_id }}
          path: reports/
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly refresh failed (${new Date().toISOString().slice(0, 10)})`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe previous release is still live. See Docs/runbook.md.`,
              labels: ["refresh-failure"],
            });
