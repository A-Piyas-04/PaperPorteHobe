# Alembic configuration for the ScholarGrid projects database (plan 08).
# The database URL comes from SCHOLARGRID_DB_URL (or persistence.default_url); see env.py.
#   alembic upgrade head            (or: python -m scholargrid.persistence upgrade)
#   alembic revision --autogenerate -m "..."

[alembic]
script_location = scholargrid/persistence/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
